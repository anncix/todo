name: flutter_todo
description: 一个支持 WebDAV 同步、本地存储的清单 TODO 应用。
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 本地数据库
  sqflite: ^2.4.1
  # 路径处理
  path: ^1.9.0
  # 获取应用目录
  path_provider: ^2.1.4
  # WebDAV 同步
  webdav_client: ^1.2.2
  # 本地通知（截止日期提醒）
  flutter_local_notifications: ^19.0.0
  # 通知时区调度
  timezone: ^0.10.0
  # 配置存储（WebDAV 地址/账号）
  shared_preferences: ^2.3.2
  # 状态管理
  provider: ^6.1.2
  # 日期格式化
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true